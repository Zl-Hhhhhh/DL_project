<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>候选排序标注</title>
<style>
:root { color-scheme: light; font-family: system-ui, sans-serif; background: #f5f6f4; color: #202b2a; }
* { box-sizing: border-box; } body { margin: 0; } button, input, select { font: inherit; }
header { background: #fff; border-bottom: 1px solid #d8dfdc; padding: 12px max(16px, calc((100vw - 1500px)/2)); display: flex; align-items: center; flex-wrap: wrap; gap: 12px 20px; }
h1 { font-size: 18px; margin: 0 auto 0 0; } h2 { font-size: 15px; margin: 0 0 10px; } label { font-size: 13px; font-weight: 600; }
input[type=text], select { border: 1px solid #aebbb6; border-radius: 4px; padding: 7px; background: #fff; color: #202b2a; }
a { color: #146b52; font-size: 13px; } main { max-width: 1500px; margin: auto; padding: 16px; }
.status { min-height: 28px; color: #53635d; font-size: 13px; } .error { color: #a1352a; }
.layout { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 20px; align-items: start; }
.source { position: sticky; top: 16px; border-right: 1px solid #d8dfdc; padding-right: 16px; }
.source img { display: block; width: 100%; aspect-ratio: 1; object-fit: contain; background: #e8ece9; }
.source p { font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; color: #53635d; }
.source label { display: grid; gap: 5px; } .source select { width: 100%; }
.heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.heading span { color: #53635d; font-size: 13px; }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.candidate { background: #fff; border: 1px solid #d7dfda; border-radius: 6px; padding: 9px; min-width: 0; }
.candidate.selected { border-color: #136b50; box-shadow: inset 0 0 0 1px #136b50; }
.candidate-top { height: 32px; display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.rank { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; color: #53635d; } .selected .rank { color: #136b50; }
.reorder { display: flex; gap: 2px; } .icon { width: 30px; height: 30px; border: 1px solid #c7d0ca; border-radius: 4px; background: #f8faf8; color: #202b2a; cursor: pointer; padding: 0; font-size: 17px; line-height: 1; }
.icon:disabled { opacity: .35; cursor: default; } .preview { display: block; width: 100%; border: 0; padding: 0; background: transparent; cursor: pointer; } .preview:focus-visible { outline: 3px solid #136b50; outline-offset: 2px; } .candidate img { display: block; width: 100%; aspect-ratio: 1; object-fit: contain; background: #e8ece9; }
.checks { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 9px; }
.checks label { display: flex; align-items: center; gap: 4px; font-size: 12px; } .checks select { max-width: 100px; padding: 4px; font-size: 12px; }
.actions { position: sticky; bottom: 0; background: #f5f6f4; border-top: 1px solid #d8dfdc; display: flex; align-items: center; justify-content: flex-end; gap: 14px; padding: 12px 0; }
.actions span { margin-right: auto; color: #53635d; font-size: 13px; }
.save { border: 0; border-radius: 4px; background: #136b50; color: white; padding: 10px 18px; cursor: pointer; font-weight: 600; }
.save:disabled { opacity: .5; cursor: default; }
@media (max-width: 1100px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 760px) { .layout { grid-template-columns: 1fr; } .source { position: static; display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 0 12px; border: 0; border-bottom: 1px solid #d8dfdc; padding: 0 0 12px; } .source h2 { grid-column: 1 / -1; } .source img { grid-row: span 2; } .source p { margin: 0; } .source label { align-self: end; } .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .actions { flex-wrap: wrap; } .actions span { flex-basis: 100%; } }
@media (max-width: 420px) { .grid { gap: 7px; } .candidate { padding: 5px; } .checks { display: grid; gap: 4px; } .checks label:last-child { display: grid; gap: 2px; } .checks select { width: 100%; } }
</style>
</head>
<body>
<header><h1>候选排序</h1><label>标注人 <input id="annotator" type="text" maxlength="64" value="reviewer"></label><label>数据集 <select id="split"><option value="train">训练</option><option value="val">验证</option><option value="test">测试</option></select></label><span id="progress"></span><a href="/pairs">两两比较</a></header>
<main><div id="status" class="status"></div><div id="work" hidden><div class="layout">
<aside class="source"><h2>原图</h2><img id="sourceImage" alt="原图"><p id="sourceInfo"></p><label>主体数量 <select id="subjectCount"><option value="" disabled selected>请选择</option><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option></select></label></aside>
<section><div class="heading"><h2>处理结果</h2><span id="candidateCount"></span></div><div id="candidates" class="grid"></div></section>
</div><div class="actions"><span id="rankProgress"></span><button id="undo" class="icon" type="button" title="撤销上一个排名" aria-label="撤销上一个排名">↶</button><button id="save" class="save">提交选择并继续</button></div></div></main>
<script>
const $ = id => document.getElementById(id);
let source = null, order = [], identities = {}, refreshTimer = null, cards = new Map(), saving = false;
function node(tag, className, text) {
  const item = document.createElement(tag); if (className) item.className = className;
  if (text !== undefined) item.textContent = text; return item;
}
function move(from, to) {
  if (saving) return;
  if (from === to || from < 0 || to < 0 || from >= order.length || to >= order.length) return;
  const [item] = order.splice(from, 1); order.splice(to, 0, item); updateRanks();
}
function choose(candidate) {
  if (saving) return;
  const index = order.findIndex(item => item.id === candidate.id);
  if (index < 0) order.push(candidate); else order.splice(index, 1);
  updateRanks();
}
function updateRanks() {
  if (!source) return;
  for (const candidate of source.candidates) {
    const card = cards.get(candidate.id);
    const index = order.findIndex(item => item.id === candidate.id);
    card.classList.toggle('selected', index >= 0);
    card.querySelector('.rank').textContent = index >= 0 ? String(index + 1).padStart(2, '0') : '--';
    const preview = card.querySelector('.preview');
    preview.title = index >= 0 ? '取消此名次' : `选为第 ${order.length + 1} 名`;
    preview.setAttribute('aria-label', preview.title);
    const buttons = card.querySelectorAll('.reorder button');
    buttons[0].disabled = index <= 0;
    buttons[1].disabled = index <= 0;
    buttons[2].disabled = index < 0 || index >= order.length - 1;
    card.querySelector('.checks select').disabled = index < 0;
  }
  $('rankProgress').textContent = `已选 ${order.length} · 未选 ${source.candidates.length - order.length} 张将标为不可接受`;
  $('undo').disabled = order.length === 0;
  $('save').disabled = saving || $('subjectCount').value === '';
}
function render() {
  const grid = $('candidates'); grid.replaceChildren(); cards = new Map();
  source.candidates.forEach((candidate, position) => {
    const card = node('article', 'candidate'); card.dataset.id = candidate.id;
    const top = node('div', 'candidate-top'); top.append(node('span', 'rank', '--'));
    const controls = node('div', 'reorder');
    for (const [symbol, offset, title] of [['⇑', null, '移到第一位'], ['↑', -1, '上移一位'], ['↓', 1, '下移一位']]) {
      const button = node('button', 'icon', symbol); button.type = 'button'; button.title = title;
      button.setAttribute('aria-label', title);
      button.addEventListener('click', () => {
        const index = order.findIndex(item => item.id === candidate.id);
        move(index, offset === null ? 0 : index + offset);
      }); controls.append(button);
    }
    top.append(controls); card.append(top);
    const preview = node('button', 'preview'); preview.type = 'button'; preview.addEventListener('click', () => choose(candidate));
    const image = node('img'); image.src = candidate.url; image.alt = `候选 ${position + 1}`; image.loading = position < 8 ? 'eager' : 'lazy';
    preview.append(image); card.append(preview);
    const checks = node('div', 'checks');
    const identityLabel = node('label', '', '主体身份 '); const identity = node('select');
    for (const [value, text] of [['unclear', '不确定'], ['preserved', '保留'], ['changed', '改变']]) {
      const option = node('option', '', text); option.value = value; identity.append(option);
    }
    identity.value = identities[candidate.id]; identity.addEventListener('change', () => { identities[candidate.id] = identity.value; });
    identityLabel.append(identity); checks.append(identityLabel); card.append(checks);
    grid.append(card); cards.set(candidate.id, card);
  });
  updateRanks();
}
async function load() {
  if (refreshTimer) clearTimeout(refreshTimer);
  const annotator = $('annotator').value.trim(); if (!annotator) { $('status').textContent = '请填写标注人'; $('work').hidden = true; return; }
  try {
    const response = await fetch(`/api/rank-next?split=${encodeURIComponent($('split').value)}&annotator=${encodeURIComponent(annotator)}`);
    const data = await response.json(); if (!response.ok) throw new Error(data.error);
    $('progress').textContent = `${data.done} / ${data.total}`; source = data.source; $('work').hidden = !source;
    if (!source) {
      $('status').textContent = data.generating ? `已生成 ${data.ready} / ${data.total} 张原图，等待下一张` : '当前数据集已标完';
      if (data.generating) refreshTimer = setTimeout(load, 15000); return;
    }
    $('status').textContent = ''; $('sourceImage').src = source.source_url;
    $('sourceInfo').textContent = `${source.source_id} · ${source.category}`;
    $('subjectCount').value = ''; order = []; identities = {};
    source.candidates.forEach(item => { identities[item.id] = 'unclear'; });
    $('candidateCount').textContent = `${source.candidates.length} 张候选`; render();
  } catch (error) { $('status').textContent = String(error); $('status').classList.add('error'); }
}
async function save() {
  if (!source) return;
  if ($('subjectCount').value === '') { $('status').textContent = '请核对并选择主体数量'; return; }
  const selected = new Set(order.map(item => item.id));
  const payload = { source_id: source.source_id, annotator: $('annotator').value.trim(), ranked_ids: order.map(item => item.id),
    subject_count: Number($('subjectCount').value), subject_count_confirmed: true,
    unacceptable: Object.fromEntries(source.candidates.map(item => [item.id, !selected.has(item.id)])), identity: identities };
  saving = true; $('save').disabled = true;
  try {
    const response = await fetch('/api/rank', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)});
    const data = await response.json(); if (!response.ok) throw new Error(data.error); await load();
  } catch (error) { $('status').textContent = String(error); $('status').classList.add('error'); }
  finally { saving = false; updateRanks(); }
}
$('save').addEventListener('click', save); $('undo').addEventListener('click', () => { if (!saving) { order.pop(); updateRanks(); } });
$('subjectCount').addEventListener('change', updateRanks); $('split').addEventListener('change', load);
$('annotator').addEventListener('change', load); load();
</script>
</body></html>
